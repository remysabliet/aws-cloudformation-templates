AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 instance running VPN (WireGuard) with SSH access using password authentication and WireGuard UDP access (IPv4 and/or IPv6).

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    Description: EC2 Instance type for the VPN server (default is t2.micro)
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small
    ConstraintDescription: Must be a valid EC2 instance type.

  AMIId:
    Type: String
    Default: ami-06e02ae7bdac6b938
    Description: The AMI ID for the EC2 instance.

  IPv4Address:
    Type: String
    Default: ""
    Description: The IPv4 address or range (e.g., 0.0.0.0/0 for open access). Leave empty to disable IPv4 access.
    ConstraintDescription: Must be a valid IPv4 CIDR (e.g., 203.0.113.0/32) or empty.

  IPv6Address:
    Type: String
    Default: ""
    Description: The IPv6 address or range (e.g., ::/0 for open access). Leave empty to disable IPv6 access.
    ConstraintDescription: Must be a valid IPv6 CIDR or empty.

  Password:
    Type: String
    NoEcho: true
    Description: The password for the VPN SSH user
    MinLength: "6"
    MaxLength: "32"
  
  ClientPublicKey:
    Type: String
    Description: The WireGuard public key for the client (to be added as a peer with IP 10.0.1.2/32).


Conditions:
  HasIPv4: !Not [!Equals [!Ref IPv4Address, ""]]
  HasIPv6: !Not [!Equals [!Ref IPv6Address, ""]]

Resources:
  VPNVPC:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true

  VPNVPCIpv6Block:
    Type: "AWS::EC2::VPCCidrBlock"
    Condition: HasIPv6
    Properties:
      VpcId: !Ref VPNVPC
      AmazonProvidedIpv6CidrBlock: true

  VPNPublicSubnet:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref VPNVPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: !If [HasIPv6, true, !Ref AWS::NoValue]
      Ipv6CidrBlock: !If [HasIPv6, !Select [0, !GetAtt VPNVPC.Ipv6CidrBlocks], !Ref AWS::NoValue]

  VPNInternetGateway:
    Type: "AWS::EC2::InternetGateway"

  VPNVPCGatewayAttachment:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref VPNVPC
      InternetGatewayId: !Ref VPNInternetGateway

  VPNRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref VPNVPC

  VPNDefaultRouteIPv4:
    Type: "AWS::EC2::Route"
    Condition: HasIPv4
    Properties:
      RouteTableId: !Ref VPNRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref VPNInternetGateway

  VPNDefaultRouteIPv6:
    Type: "AWS::EC2::Route"
    Condition: HasIPv6
    Properties:
      RouteTableId: !Ref VPNRouteTable
      DestinationIpv6CidrBlock: "::/0"
      GatewayId: !Ref VPNInternetGateway

  VPNRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref VPNPublicSubnet
      RouteTableId: !Ref VPNRouteTable

  VPNInstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Allow SSH, WireGuard, and ICMP (ping) access (IPv4 and/or IPv6)"
      VpcId: !Ref VPNVPC
      SecurityGroupIngress:
        - !If [HasIPv4, { IpProtocol: "tcp", FromPort: 22, ToPort: 22, CidrIp: !Ref IPv4Address }, !Ref AWS::NoValue]
        - !If [HasIPv6, { IpProtocol: "tcp", FromPort: 22, ToPort: 22, CidrIpv6: !Ref IPv6Address }, !Ref AWS::NoValue]
        - !If [HasIPv4, { IpProtocol: "udp", FromPort: 51820, ToPort: 51820, CidrIp: !Ref IPv4Address }, !Ref AWS::NoValue]
        - !If [HasIPv6, { IpProtocol: "udp", FromPort: 51820, ToPort: 51820, CidrIpv6: !Ref IPv6Address }, !Ref AWS::NoValue]
        - !If [HasIPv4, { IpProtocol: "icmp", FromPort: -1, ToPort: -1, CidrIp: !Ref IPv4Address }, !Ref AWS::NoValue]
        - !If [HasIPv6, { IpProtocol: "58", FromPort: -1, ToPort: -1, CidrIpv6: !Ref IPv6Address }, !Ref AWS::NoValue]

  VPNInstance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AMIId
      SubnetId: !Ref VPNPublicSubnet
      SecurityGroupIds:
        - !Ref VPNInstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          users:
            - default
            - name: vpnuser
              groups: sudo
              shell: /bin/bash
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
              lock_passwd: false
              plain_text_passwd: "${Password}"

          ssh_pwauth: true

          write_files:
            - path: /etc/ssh/sshd_config.d/99-enable-password-auth.conf
              permissions: '0644'
              owner: root:root
              content: |
                PasswordAuthentication yes
                ChallengeResponseAuthentication no
                PermitRootLogin no

          runcmd:
            - sysctl -w net.ipv4.ip_forward=1
            - sysctl -w net.ipv6.conf.all.forwarding=1
            - sysctl --system
            - systemctl restart sshd
            - apt-get update -y
            - apt-get install -y wireguard
            - mkdir -p /etc/wireguard
            - PRIVATE_KEY=$(wg genkey)
            - echo "$PRIVATE_KEY" | wg pubkey > /etc/wireguard/publickey
            - echo "[Interface]" > /etc/wireguard/wg0.conf
            - echo "Address = 10.0.1.1/24" >> /etc/wireguard/wg0.conf
            - echo "ListenPort = 51820" >> /etc/wireguard/wg0.conf
            - echo "PrivateKey = $PRIVATE_KEY" >> /etc/wireguard/wg0.conf
            - echo "" >> /etc/wireguard/wg0.conf
            - echo "[Peer]" >> /etc/wireguard/wg0.conf
            - echo "PublicKey = ${ClientPublicKey}" >> /etc/wireguard/wg0.conf
            - echo "AllowedIPs = 10.0.1.2/32" >> /etc/wireguard/wg0.conf
            - wg-quick up wg0
            - systemctl enable wg-quick@wg0

Outputs:
  VPNInstancePublicIPIPv4:
    Condition: HasIPv4
    Description: "Public IP of the EC2 instance"
    Value: !GetAtt VPNInstance.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-VPNInstancePublicIPv4"

  VPNInstancePublicDNS:
    Condition: HasIPv4
    Description: "Public DNS name of the EC2 instance (IPv4)"
    Value: !GetAtt VPNInstance.PublicDnsName

  VPNInstancePublicDNSIPv6:
    Condition: HasIPv6
    Description: "Public DNS name (manually resolvable via IPv6, if assigned)"
    Value: !Sub "Set a custom DNS if needed for IPv6: use AAAA record to ${AWS::StackName}-VPNInstancePublicIPv6"
